# Documentation à propos de cette page : https://fshschool.org/docs/sushi/configuration/

id: ans.fhir.fr.mappingcdafhir
canonical: https://interop.esante.gouv.fr/ig/fhir/mappingcdafhir # the last part of canonical and id must be the same
name: CDA2FHIRMAP # Should be an acronym
title: POC - Mapping CDA to FHIR 
publisher:
  name: Agence du Numérique en Santé (ANS) - 2-10 Rue d'Oradour-sur-Glane, 75015 Paris
  url: https://esante.gouv.fr
status: draft
version: 0.1.0 # shall conforms to Semantic Versioning https://fr.wiktionary.org/wiki/SemVer
fhirVersion: 4.0.1
copyrightYear: 2020+
releaseLabel: ci-build # le release label doit être conforme au cycle de vie de la doctrine du ci-sis
jurisdiction: urn:iso:std:iso:3166#FR "France (la)"

parameters: #Parameters list - https://build.fhir.org/ig/FHIR/fhir-tools-ig/CodeSystem-ig-parameters.html
  shownav: 'true'
  path-binary: input/attachments
  path-resource:
  - input/fml
  - input/resources
  path-expansion-params: '../../expansion-params.json' # for using French SNOMED CT Extension
  pin-canonicals: pin-all
  apply-contact: true
  logging:
    - tx
    - html
    - generate
    - init
    - progress
  i18n-default-lang: fr
  apply-jurisdiction: true
  i18n-lang:
    - en
  translation-sources:
    - input/translations/en


dependencies:
  hl7.cda.uv.core: 2.0.0-sd
  ans.fhir.fr.annuaire: 1.1.0
  hl7.fhir.fr.core: 2.1.0



pages:
  index.md:
    title: Accueil

  mecanismes-mapping.md:
    title: Mécanismes de mapping

  Architecture-de-mapping.md:
    title: Architecture de mapping

  Transformation-FML.md:
    title: Transformation FML

  guide-demarrage.md:
    title: Démarrage Matchbox

  outils-mapping.md:
    title: Autres méthodes de mapping

  change-log.md:
    title: Historique des versions

  translationinfo.md:
    title: Informations sur la traduction

menu:
  Accueil: index.html

  Mécanismes de mapping:
    Architecture de mapping: Architecture-de-mapping.html
    Transformation FML: Transformation-FML.html
    Démarrage Matchbox: guide-demarrage.html

  Autres méthodes de mapping: outils-mapping.html

  Ressources de conformité: artifacts.html

  Autres ressources:
    Spécification FHIR: new-tab {{site.data.fhir.path}}index.html
    Site de l’ANS: new-tab https://esante.gouv.fr/
    Documentation: new-tab https://interop.esante.gouv.fr/ig/documentation/

  Historique des versions: change-log.html
